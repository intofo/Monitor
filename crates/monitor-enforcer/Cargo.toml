[package]
name = "monitor-enforcer"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
monitor-core = { path = "../monitor-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"
